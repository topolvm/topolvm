name: meta

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

jobs:
  actionlint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make run-actionlint

  ghalint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make run-ghalint

  zizmor:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make run-zizmor
